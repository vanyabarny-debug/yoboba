<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>yomoyo — перерыв</title>
  <style>
    @font-face {
      font-family: Nunito;
      font-style: normal;
      font-weight: 700;
      src: url("fonts/nunito-cyr.woff2") format("woff2");
      unicode-range: U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }
    @font-face {
      font-family: Nunito;
      font-style: normal;
      font-weight: 700;
      src: url("fonts/nunito-lat.woff2") format("woff2");
    }
    @font-face {
      font-family: Fredoka;
      font-style: normal;
      font-weight: 700;
      src: url("fonts/fredoka-lat.woff2") format("woff2");
    }
    @page { size: 297mm 210mm; margin: 0; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 297mm;
      height: 210mm;
      background: #F4F5F6;
      color: #20181B;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .page {
      width: 297mm;
      height: 210mm;
      position: relative;
    }
    h1 {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      font-family: Nunito, sans-serif;
      font-style: normal;
      font-synthesis: none;
      font-weight: 700;
      font-size: 68pt;
      letter-spacing: -0.03em;
      line-height: 1;
      color: #20181B;
      text-align: center;
      white-space: nowrap;
    }
    .logo {
      position: absolute;
      left: 50%;
      bottom: 100%;
      transform: translateX(-50%);
      margin: 0 0 12mm;
      font-family: Fredoka, Nunito, sans-serif;
      font-weight: 700;
      font-size: 28pt;
      letter-spacing: 0.12em;
      color: #FF6B6B;
      line-height: 1;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>
      <span class="logo">yomoyo</span>
      перерыв 15 минут
    </h1>
  </div>
</body>
</html>
