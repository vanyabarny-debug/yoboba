services:
  web:
    build:
      context: .
      args:
        # compose подставляет значения из соседнего .env
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_VK_CLIENT_ID: ${NEXT_PUBLIC_VK_CLIENT_ID}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    image: yomoyo-web
    # серверные секреты подтягиваются в рантайме
    env_file: .env
    environment:
      # на VPS Node часто падает на IPv6 к внешним API («fetch failed»)
      NODE_OPTIONS: '--dns-result-order=ipv4first'
    restart: unless-stopped
    # слушаем только localhost — наружу проксирует nginx с TLS
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # касса, смены, операции — переживают rebuild
      - yoboba_data:/app/data

volumes:
  yoboba_data:
